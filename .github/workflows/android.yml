name: Android APK

# Builds the Android app (Capacitor wrapper around index.html + lib/resolve.js)
# and publishes it as the "latest" release: .../releases/download/latest/AllVid.apk
# Manual only (Actions tab -> Run workflow); the site links it for Android phones.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Collect web files
        run: |
          mkdir -p app/www/lib
          cp index.html i18n.js manifest.json icon-192.png icon-512.png apple-touch-icon.png app/www/
          cp lib/resolve.js app/www/lib/

      - name: Create Android project
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          bash native/patch.sh
          npx cap sync android

      - name: Build signed release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          # Fixed key so updates install over the old version (public sideload app; key kept in the repo).
          "$BT/apksigner" sign --ks ../native/release.keystore --ks-pass pass:videodl-sideload --key-pass pass:videodl-sideload \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out ../../AllVid.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs ../../AllVid.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AllVid.apk \
            --title "AllVid for Android" \
            --notes "Install AllVid.apk on Android. Built from ${GITHUB_SHA::7}."
