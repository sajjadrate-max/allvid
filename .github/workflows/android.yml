name: Android APK

# Builds the Android app (Capacitor wrapper around index.html + lib/resolve.js)
# and publishes it as the "latest" release: .../releases/download/latest/VideoDownloader.apk
on:
  push:
    branches: [main]
    paths: ['index.html', 'lib/**', 'app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Collect web files
        run: |
          mkdir -p app/www/lib
          cp index.html manifest.json icon-192.png icon-512.png apple-touch-icon.png app/www/
          cp lib/resolve.js app/www/lib/

      - name: Create Android project
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          bash native/patch.sh
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk VideoDownloader.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VideoDownloader.apk \
            --title "Video Downloader for Android" \
            --notes "Install VideoDownloader.apk on Android. Built from ${GITHUB_SHA::7}."
